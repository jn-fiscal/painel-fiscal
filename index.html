<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Fiscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBFA; --surface:#FFFFFF; --border:#E7E5E0;
    --text:#1E1E1C; --text-soft:#65635C; --text-faint:#9C9A92;
    --federal:#2B6CB0; --federal-bg:#EAF2FB;
    --ms:#15806B; --ms-bg:#E7F5F1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 70px;}
  .masthead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
  .masthead h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;margin:0 0 4px;letter-spacing:-0.02em;}
  .masthead .sub{font-size:14px;color:var(--text-soft);}
  .updated-pill{background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:7px 14px;font-size:12.5px;color:var(--text-soft);white-space:nowrap;}
  .updated-pill strong{color:var(--text);font-weight:600;}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:100px;padding:7px 14px;font-size:13px;color:var(--text-soft);cursor:pointer;user-select:none;}
  .chip.active{color:#fff;border-color:var(--text);background:var(--text);}
  .search{flex:1;min-width:180px;border:1px solid var(--border);border-radius:100px;padding:7px 16px;font-size:13px;font-family:'Inter',sans-serif;background:var(--surface);}
  .day-group{margin-bottom:26px;}
  .day-label{font-size:12.5px;font-weight:600;color:var(--text-faint);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;}
  .entries{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .entry{display:flex;gap:14px;padding:16px 20px;}
  .entry + .entry{border-top:1px solid var(--border);}
  .entry-bar{width:4px;flex-shrink:0;border-radius:4px;}
  .entry-bar.federal{background:var(--federal);}
  .entry-bar.ms{background:var(--ms);}
  .entry-body{flex:1;min-width:0;}
  .entry-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;}
  .tag.federal{background:var(--federal-bg);color:var(--federal);}
  .tag.ms{background:var(--ms-bg);color:var(--ms);}
  .fonte-tag{font-size:12px;color:var(--text-faint);}
  .entry h3{font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;margin:0 0 4px;}
  .entry a.titulo-link{color:var(--text);text-decoration:none;}
  .entry a.titulo-link:hover{text-decoration:underline;}
  .entry p{font-size:13.5px;color:var(--text-soft);margin:0;}
  .empty, .loading{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center;color:var(--text-faint);font-size:13.5px;}
  @media (max-width:640px){.masthead{flex-direction:column;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Painel fiscal</h1>
      <div class="sub">Federal e Mato Grosso do Sul — frigorífico e agropecuária</div>
    </div>
    <div class="updated-pill">Atualizado em <strong id="last-update">—</strong></div>
  </div>

  <div class="filters">
    <label class="chip active" data-jur="federal">Federal</label>
    <label class="chip active" data-jur="ms">Mato Grosso do Sul</label>
    <input class="search" id="search" type="text" placeholder="Buscar por palavra-chave...">
  </div>

  <div id="feed"><div class="loading">Carregando...</div></div>
</div>

<script>
let dados = [];

async function carregar(){
  try{
    const [dRes, mRes] = await Promise.all([
      fetch('data.json?_=' + Date.now()),
      fetch('meta.json?_=' + Date.now()).catch(()=>null)
    ]);
    dados = await dRes.json();
    if(mRes && mRes.ok){
      const meta = await mRes.json();
      if(meta.ultima_execucao){
        const d = new Date(meta.ultima_execucao);
        document.getElementById('last-update').textContent = d.toLocaleString('pt-BR');
      }
    }
  }catch(e){
    document.getElementById('feed').innerHTML = '<div class="empty">Não foi possível carregar os dados (data.json). Verifique se o arquivo existe neste mesmo diretório.</div>';
    return;
  }
  render();
}

document.querySelectorAll('.chip[data-jur]').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    chip.classList.toggle('active');
    render();
  });
});
document.getElementById('search').addEventListener('input', render);

function render(){
  const jursAtivos = [...document.querySelectorAll('.chip.active[data-jur]')].map(c=>c.dataset.jur);
  const termo = document.getElementById('search').value.trim().toLowerCase();

  const filtrados = dados.filter(d=>{
    if(!jursAtivos.includes(d.jur)) return false;
    if(termo && !(d.titulo || '').toLowerCase().includes(termo) && !(d.resumo || '').toLowerCase().includes(termo)) return false;
    return true;
  });

  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  if(filtrados.length === 0){
    feed.innerHTML = '<div class="empty">Nenhuma entrada encontrada. O painel começa vazio até o scraper rodar pela primeira vez.</div>';
    return;
  }

  const porDia = {};
  filtrados.forEach(d=>{
    const dia = d.data || 'Sem data';
    if(!porDia[dia]) porDia[dia] = [];
    porDia[dia].push(d);
  });

  Object.keys(porDia).forEach(dia=>{
    const group = document.createElement('div');
    group.className = 'day-group';
    const label = document.createElement('div');
    label.className = 'day-label';
    label.textContent = dia;
    group.appendChild(label);

    const container = document.createElement('div');
    container.className = 'entries';

    porDia[dia].forEach(item=>{
      const entry = document.createElement('div');
      entry.className = 'entry';

      const bar = document.createElement('div');
      bar.className = 'entry-bar ' + item.jur;
      entry.appendChild(bar);

      const body = document.createElement('div');
      body.className = 'entry-body';

      const top = document.createElement('div');
      top.className = 'entry-top';
      const tagJur = document.createElement('span');
      tagJur.className = 'tag ' + item.jur;
      tagJur.textContent = item.jur === 'federal' ? 'Federal' : 'MS';
      top.appendChild(tagJur);
      const fonte = document.createElement('span');
      fonte.className = 'fonte-tag';
      fonte.textContent = item.fonte || '';
      top.appendChild(fonte);
      body.appendChild(top);

      const h3 = document.createElement('h3');
      if(item.link){
        const a = document.createElement('a');
        a.href = item.link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'titulo-link';
        a.textContent = item.titulo;
        h3.appendChild(a);
      } else {
        h3.textContent = item.titulo;
      }
      body.appendChild(h3);

      if(item.resumo){
        const p = document.createElement('p');
        p.textContent = item.resumo;
        body.appendChild(p);
      }

      entry.appendChild(body);
      container.appendChild(entry);
    });

    group.appendChild(container);
    feed.appendChild(group);
  });
}

carregar();
</script>
</body>
</html>

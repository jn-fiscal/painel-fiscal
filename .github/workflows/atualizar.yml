name: Atualizar Painel Fiscal

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scraper.py

      - name: Publicar mudanças no repositório
        run: |
          git config user.name "painel-fiscal-bot"
          git config user.email "painel-fiscal-bot@users.noreply.github.com"
          git add data.json seen_urls.json meta.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para publicar"
            exit 0
          fi
          git commit -m "Atualização automática $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push

name: Atualizar Painel Fiscal

on:
  schedule:
    # 11:30 UTC = 08:30 no horário de Mato Grosso do Sul (UTC-3)
    - cron: '30 11 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scraper.py

      - name: Publicar mudanças no repositório
        run: |
          git config user.name "painel-fiscal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json seen_urls.json meta.json
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +'%Y-%m-%d')"
          git push
